name: COPEL Energy Compensation Pipeline

on:
  # Execução agendada (todo dia às 2h AM - Horário UTC)
  schedule:
    - cron: '0 5 * * *'  # 5 AM UTC = 2 AM BRT
  
  # Permite execução manual
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (single month)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      test_month:
        description: 'Test month (1-12)'
        required: false
        default: '3'
      test_year:
        description: 'Test year (YYYY)'
        required: false
        default: '2026'

jobs:
  run-pipeline:
    name: Process COPEL Invoices
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔍 Verify Python version
        run: |
          python --version
          pip list
      
      - name: ⚡ Run pipeline
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PYTHONUNBUFFERED: 1
        run: |
          python energy_compensation_pipeline.py
      
      - name: 📊 Upload results (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-results-${{ github.run_number }}
          path: data/03-Output/*.csv
          retention-days: 30
          if-no-files-found: warn
      
      - name: ✅ Pipeline completed
        if: success()
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "📊 Results uploaded to Google Drive"
      
      - name: ❌ Pipeline failed
        if: failure()
        run: |
          echo "❌ Pipeline failed!"
          echo "Check logs above for details"
